<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" role="img" aria-labelledby="title">
  <title id="title">Sample five people, calculate the sample mean and variance, and use them to estimate population parameters</title>
  <rect width="1100" height="270" fill="white"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#505459"/>
    </marker>
  </defs>
  <g font-family="Georgia, serif" font-size="21" fill="#30343a" text-anchor="middle">
    <text x="125" y="43">Population (μ, σ²)</text>
    <rect x="70" y="78" width="110" height="154" fill="none" stroke="#505459"/>
    <text x="125" y="112">X₁</text><text x="125" y="145">X₂</text><text x="125" y="180">⋮</text><text x="125" y="216">X₁₀₀₀₀₀₀</text>
    <path d="M195 155 H385" stroke="#505459" marker-end="url(#a)"/>
    <text x="290" y="140" font-size="19">Sample people</text><text x="290" y="180" font-size="19">Ask their ages</text>
    <rect x="401" y="78" width="84" height="154" fill="none" stroke="#505459"/>
    <text x="443" y="112">X₁</text><text x="443" y="145">X₂</text><text x="443" y="180">⋮</text><text x="443" y="216">X₅</text>
    <path d="M500 155 H650" stroke="#505459" marker-end="url(#a)"/>
    <text x="575" y="140" font-size="19">Calculate</text><text x="575" y="180" font-size="19">two numbers</text>
    <text x="680" y="120" text-anchor="start">X̄</text><text x="720" y="120">=</text>
    <text x="887" y="104">X₁ + ··· + X₅</text><path d="M768 115 H1010" stroke="#30343a"/><text x="887" y="143">5</text>
    <text x="680" y="200" text-anchor="start">S²</text><text x="720" y="200">=</text>
    <text x="893" y="183">(X₁ − X̄)² + ··· + (X₅ − X̄)²</text><path d="M744 195 H1045" stroke="#30343a"/><text x="893" y="223">5 − 1</text>
    <path d="M720 92 V36 H245" stroke="#505459" stroke-dasharray="6 5" fill="none" marker-end="url(#a)"/>
    <rect x="370" y="20" width="233" height="30" fill="white"/><text x="486" y="42" font-size="19">Use as estimates</text>
  </g>
</svg>
