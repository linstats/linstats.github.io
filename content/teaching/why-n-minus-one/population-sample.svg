<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img" aria-labelledby="title desc">
<title id="title">Population and sample ages</title><desc id="desc">Fifteen population ages with mean 39. The five selected ages are 49, 47, 45, 43, and 41, with sample mean 45. Dashed lines show both means.</desc>
